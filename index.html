<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục CSS Grid Responsive</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>Header</h1>
            <p>Trang web sử dụng CSS Grid</p>
        </header>

        <aside class="sidebar">
            <h2>Sidebar</h2>
            <p>Trang chủ</p>
            <p>Giới thiệu</p>
            <p>Liên hệ</p>
        </aside>

        <main class="content">
            <h2>Main Content</h2>
            <p>Đây là phần nội dung chính của trang web.</p>
            <p>Trên máy tính, Sidebar và Content nằm cạnh nhau.</p>
            <p>Trên màn hình nhỏ, các phần xếp thành một cột.</p>
        </main>

        <footer class="footer">
            <p>Footer — Bài thực hành CSS Grid</p>
        </footer>
    </div>
</body>

</html>
